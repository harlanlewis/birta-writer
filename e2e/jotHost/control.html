<!doctype html>
<!-- The CONTROL page for e2e/jotHost: identical to index.html except that
     `hostCapabilities` is ABSENT from the __i18n bootstrap, which must read as
     the VS Code host (absent means all): the TOC panel and every host-bound
     toolbar item exist. Without it the suite could pass against a build
     that lost the TOC for everyone.

     Keep this file's only difference from index.html the missing field. It
     links the same dist/hostPalette.css for that reason, even though a real
     VS Code host gets its palette from the workbench: a second difference
     would make a failure here ambiguous between the two. -->
<meta charset="utf-8">
<link rel="stylesheet" href="dist/hostPalette.css">
<style>
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); margin: 0; }
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => document.body.classList.add("editor-width-auto", "vscode-dark"));
  window.__i18n = { translations: {}, isMac: true, toolbar: { placements: {}, order: [] }, tocAutoHideThreshold: 3 };
  // The shell seeds `getState` from the persisted bag in its document-start
  // user script (Bridge.userScript), so the page reads it synchronously before
  // the bundle runs. A harness whose store starts empty cannot see anything
  // that boots FROM that bag, so it is seeded the same way here.
  window.__state = window.__seedState;
  window.__posted = [];
  const CONTENT = "# One\n\nSome text.\n\n## Two\n\ntext\n\n## Three\n\ntext\n\n## Four\n\ntext\n\n## Five\n\ntext\n";
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        window.postMessage({ type: "init", content: CONTENT, frontmatter: "", syncVersion: 1 }, "*");
      }
    },
    // Matching index.html's real store rather than a stub: this page is the
    // CONTROL, so the profile has to be the only difference between them.
    getState: () => window.__state,
    setState: (s) => { window.__state = s; },
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
