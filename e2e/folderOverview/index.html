<!doctype html>
<!-- e2e harness for the folder overview (MAR-488). Mirrors the provider
     template with acquireVsCodeApi stubbed, declared as a directory window of
     the Mac app (`projectFiles` and `folderIndex`), so a dot or a row posts
     `openProjectFile` the way the app's page does. It answers the page's
     `requestFolderIndex` with a folder whose hub is NOT the open note, and
     `requestFolderRecents` with a recent files list, and runs the page's
     command the way the app's View menu does, with an `editorCommand`.
     `?recents=0` answers no recents at all, as VS Code does. `?graph=0` turns
     the folder graph setting off. The --vscode-* variables stand in for the
     set VS Code injects natively. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #999999;
    --vscode-focusBorder: #007fd4;
    --vscode-panel-border: rgba(128, 128, 128, 0.2);
    --vscode-icon-foreground: #cccccc;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-list-hoverBackground: rgba(90, 93, 94, 0.2);
    --vscode-list-activeSelectionBackground: rgba(0, 127, 212, 0.26);
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-editor-selectionBackground: #264f78;
    --vscode-editorWidget-background: #252526;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-editorWidget-foreground: #cccccc;
    --vscode-editorWidget-border: #454545;
    --vscode-widget-shadow: rgba(0, 0, 0, 0.36);
    --vscode-textLink-foreground: #3794ff;
    --vscode-charts-red: #f14c4c;
    --vscode-charts-orange: #d18616;
    --vscode-charts-yellow: #cca700;
    --vscode-charts-green: #89d185;
    --vscode-charts-blue: #3794ff;
    --vscode-charts-purple: #b180d7;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); margin: 0; }
  .editor-topbar { height: 40px; }
</style>
<script>
  const params = new URLSearchParams(location.search);
  const RECENTS = params.get("recents") !== "0";
  // The Mac app's Cmd+T in a folder window (MAR-488): a note that is not
  // written yet, so empty and not in the index, with the overview command
  // sent straight behind the init, as the app sends it on the first ready.
  const NEW_TAB = params.get("newTab") === "1";
  // A host declaring `fileLauncher` (the Mac app): the start view's buttons
  // and the reader's recent files. `empty=1` is a window holding no file,
  // which the host says with `showStartView` straight behind the init.
  const LAUNCHER = params.get("launcher") === "1" || params.get("empty") === "1";
  const EMPTY = params.get("empty") === "1";
  window.__i18n = {
    translations: {},
    isMac: true,
    folderGraph: params.get("graph") !== "0",
    toolbar: { placements: {}, order: [] },
    tocVisibility: "hidden",
    proofread: { grammarCheck: false, spellCheck: false },
    host: {
      capabilities: ["toc", "contentMeasure", ...(EMPTY ? [] : ["projectFiles", "folderIndex"]), ...(LAUNCHER ? ["fileLauncher"] : [])],
      arrangements: [], shortcuts: [],
    },
  };
  window.__posted = [];
  const CONTENT = NEW_TAB || EMPTY ? "" : ["# Standup", "", "Body.", ""].join("\n");

  const SELF = "notes/standup.md";
  // What the host says this document is in the index: nothing, for a note
  // that is not on disk yet.
  const INDEXED_SELF = NEW_TAB ? null : SELF;
  const HUB = "index.md";
  const note = (path, name, type = null) => ({ path, name, type, tags: [], status: null, trust: null, staleAfter: null });
  const edge = (from, to) => ({ from, to, target: to, kind: "wiki", text: to, line: 3 });
  // The hub is named by a dozen notes; each of four names a note further out.
  const RING = Array.from({ length: 12 }, (_, i) => [`topics/topic-${i + 1}.md`, `Topic number ${i + 1}`]);
  const FAR = RING.slice(0, 4).map(([p], i) => [`deep/detail-${i + 1}.md`, `Detail ${i + 1}`, p]);
  window.__folderIndex = {
    rootName: "vault",
    truncated: false,
    nodes: [note(HUB, "Index"), note(SELF, "Standup"), ...RING.map(([p, n]) => note(p, n)), ...FAR.map(([p, n]) => note(p, n))],
    edges: [...RING.map(([p]) => edge(p, HUB)), ...FAR.map(([p, , via]) => edge(via, p)), edge(SELF, "topics/topic-1.md")],
  };
  window.__recents = ["notes/standup.md", "deep/detail-2.md", "topics/topic-5.md", "loose.txt"];
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        window.postMessage({ type: "init", content: CONTENT, frontmatter: "", syncVersion: 1 }, "*");
        if (NEW_TAB) { window.postMessage({ type: "editorCommand", command: "showFolderOverview" }, "*"); }
        if (EMPTY) { window.postMessage({ type: "showStartView" }, "*"); }
      }
      if (msg.type === "requestFolderIndex") {
        window.postMessage({ type: "folderIndex", index: window.__folderIndex, self: INDEXED_SELF }, "*");
      }
      if (msg.type === "requestRecentFiles" && LAUNCHER) {
        const files = Array.from({ length: 9 }, (_, i) => ({ path: `/Users/r/notes/recent-${i + 1}.md`, name: `recent-${i + 1}.md`, detail: "~/notes" }));
        window.postMessage({ type: "recentFiles", files }, "*");
      }
      if (msg.type === "requestFolderRecents" && RECENTS) {
        window.postMessage({ type: "folderRecents", paths: window.__recents }, "*");
      }
    },
    getState: () => undefined,
    setState: () => {},
  });
  window.__runCommand = (command) => window.postMessage({ type: "editorCommand", command }, "*");
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
