<!doctype html>
<!-- e2e harness: PlantUML render pipeline (MAR-30). Real-browser truths jsdom
     cannot reach, against the REAL WebAssembly engine: that it instantiates at
     all under a module bundle, that the Graphviz bridge is wired (class
     diagrams fail without it while sequence diagrams still work), that a
     remote-theme directive fails closed instead of fetching, and that an
     invalid diagram settles on an error card without wedging the main thread.
     Nothing here is observable in jsdom, which has no WebAssembly pipeline for
     the engine and no layout for the pane. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #999999;
    --vscode-editor-font-family: monospace; --vscode-font-family: -apple-system, sans-serif; --vscode-font-size: 13px;
    --vscode-editorHoverWidget-background: #252526; --vscode-editorHoverWidget-foreground: #cccccc;
    --vscode-editorHoverWidget-border: #454545; --vscode-focusBorder: #007fd4;
    --vscode-toolbar-hoverBackground: rgba(90,93,94,0.31); --vscode-list-hoverBackground: #2a2d2e;
    --vscode-button-background: #0e639c; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #1177bb;
    --vscode-button-secondaryBackground: #3a3d41;
    --vscode-inputOption-activeBackground: rgba(14,99,156,0.4); --vscode-inputOption-activeBorder: #007fd4;
    --vscode-editor-hoverHighlightBackground: rgba(90,93,94,0.25);
    --vscode-editor-selectionBackground: #264f78;
    --vscode-editorWidget-background: #252526; --vscode-editorWidget-border: #454545;
    --vscode-textCodeBlock-background: #2a2a2a;
    --vscode-editorLineNumber-foreground: #858585;
    --vscode-panel-border: #444444;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  window.__i18n = {
    translations: {}, isMac: true,
    // `auto` so the window `theme-changed` listener is live (the default
    // `light` mode ignores editor theme switches by design).
    mermaidTheme: "auto",
    toolbar: { placements: {}, order: [] },
  };
  window.__posted = [];
  const DOC = [
    "# PlantUML render",
    "",
    // A sequence diagram: rendered by PlantUML's own built-in layout, so this
    // one exercises the engine with no Graphviz involvement.
    "```plantuml",
    "@startuml",
    "Alice -> Bob : hello",
    "Bob --> Alice : hi",
    "@enduml",
    "```",
    "",
    // A CLASS diagram: laid out by Graphviz through the bridge the loader
    // installs. It is the pinned half of the feature — without the bridge this
    // one fails with \"graphviz render failed\" while the sequence diagram above
    // still renders, which is exactly the half-broken state to catch.
    "```puml",
    "@startuml",
    "class Foo {",
    "  +bar()",
    "}",
    "Foo <|-- Baz",
    "@enduml",
    "```",
    "",
    // A diagram reaching for a REMOTE theme. The engine is compiled without
    // its remote-fetch feature, so this must fail closed rather than make the
    // editor fetch anything (docs/NETWORK_POSTURE.md, rung 0).
    "```plantuml",
    "@startuml",
    "!theme spacelab",
    "A -> B",
    "@enduml",
    "```",
    "",
    // An INVALID diagram, deliberately last so the first-match selectors in
    // checks.mjs keep addressing the valid ones. It must settle on its error
    // card with the main thread alive.
    //
    // Getting this genuinely invalid took a second try: PlantUML is LENIENT,
    // and the obvious "class {{{ unparseable" renders a small diagram rather
    // than throwing. This input fails the diagram-type dispatch itself, which
    // is one of the few things the engine does refuse.
    "```plantuml",
    "@startuml",
    "!!!!! %%%% @@@@",
    "@enduml",
    "```",
    "",
  ].join("\n");

  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready")
        window.postMessage({ type: "init", content: DOC + "\n", syncVersion: 1 }, "*");
    },
    getState: () => undefined, setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
