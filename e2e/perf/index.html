<!doctype html>
<!-- Launch-perf harness page: mirrors the provider template
     (src/MarkdownEditorProvider.ts) with acquireVsCodeApi stubbed, so it drives
     the exact production bundle in headless Chromium.

     Two deliberate faithfulness choices vs the other e2e suites:
     1. A CSP meta mirroring the provider's, with a FIXED nonce ("perfharness")
        on every script tag. This enforces nonce-based script loading exactly
        like VS Code, so a future change that embeds a nonce'd content script
        (initial-content embedding) surfaces CSP mistakes here first.
     2. Init content is injected by the runner as window.__perfInit BEFORE any
        script runs (page.addInitScript), and the stub replies to "ready"
        synchronously with it — no fetch inside the ready handler, so the
        ready→init timing is not polluted by fixture I/O. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none';
           style-src 'self' 'unsafe-inline';
           script-src 'nonce-perfharness' 'self';
           img-src 'self' data:;
           font-src 'self' data:;">
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #999999;
    --vscode-editorWidget-background: #252526;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-editorWidget-border: #454545;
    --vscode-widget-border: rgba(128, 128, 128, 0.25);
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-focusBorder: #007fd4;
    --vscode-editor-selectionBackground: #264f78;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-list-activeSelectionBackground: #094771;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-textLink-foreground: #3794ff;
    --vscode-editor-font-family: monospace;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  /* Real toolbar height (~40px in VS Code at default font) so the measured
     --editor-topbar-height, and everything laid out from it, matches production. */
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script nonce="perfharness">
  // Settings both perf harnesses can flip from the URL. Default-OFF features
  // are structurally invisible to the CI gates — nothing in `main`'s fixture
  // set ever turns them on — so a feature like the line-number gutter can only
  // be measured if the harness can be asked to enable it. `?lineNumbers=1`.
  const __perfFlags = new URLSearchParams(location.search);
  window.__i18n = {
    translations: {}, isMac: true, toolbar: { placements: {}, order: [] },
    lineNumbers: __perfFlags.get("lineNumbers") === "1",
  };
  // Default-ON features need the mirror image of the lineNumbers hatch: a way
  // to turn one OFF, so its cost can be measured as an A/B against a bundle
  // that is otherwise identical. `?proofreading=0` sets only the master gate;
  // every other proofread default is left alone (the plugin merges over
  // DEFAULT_CONFIG), so the flag reads exactly as the user setting does.
  if (__perfFlags.get("proofreading") === "0") {
    window.__i18n.proofread = { proofreadingEnabled: false };
  }
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        const init = window.__perfInit || { content: "# Sample\n\ntext\n" };
        window.postMessage({
          type: "init",
          content: init.content,
          lineMap: init.lineMap || [],
          syncVersion: 0,
        }, "*");
      }
      // Answer the proofread lint request, because a host that never answers
      // is not a host state any user is in, and the page behaves differently
      // in it: findings are remembered by block text, so a request that is
      // never answered teaches the page nothing and every later rescan asks
      // about the whole document again. Measured against a silent stub, the
      // per-keystroke cost of proofreading is therefore the cost of a path the
      // shipped product does not take.
      //
      // Answered with no findings, which is a real host answer (a clean
      // paragraph) and keeps the harness deterministic. What that still does
      // NOT measure is the decoration-building half, which scales with how
      // much a document actually trips: `buildLintDecorations` runs here but
      // builds nothing. Seeding findings would mean inventing the host's
      // opinion, so that half stays uncovered rather than covered wrongly.
      if (msg.type === "lintBlocks") {
        window.postMessage({
          type: "lintResults",
          id: msg.id,
          results: (msg.blocks || []).map((b) => ({ key: b.key, lints: [] })),
        }, "*");
      }
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" nonce="perfharness" src="dist/webview.js"></script>
