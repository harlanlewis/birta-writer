<!doctype html>
<!-- e2e harness page for the mac profile (MAR-373): the capabilities that
     shell declares, in the __i18n bootstrap. control.html beside it is the same
     page with the field ABSENT, which must read as the VS Code host, so the
     suite discriminates. Five headings so the TOC auto-opens on the control
     page, and `tocVisibility: "hidden"` here because the shell sends that too
     (`BootConfig.i18nObject`): a small window opens its sidebar when it is
     asked to rather than because a note grew a fourth heading.

     The palette is dist/hostPalette.css, the same file the Mac shell links,
     rather than a hand-written stub: what this suite renders is then what the
     panel renders. A stub was a second palette that nothing else used, so a
     wrong value in the real one could not fail here. -->
<meta charset="utf-8">
<link rel="stylesheet" href="dist/hostPalette.css">
<style>
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); margin: 0; }
  <!-- A FLOOR, not a fit. The real page (mac/Resources/index.html) pins no
       height at all; this stands in for the titlebar band the panel's bar sits
       under, and a fixed height would model a bar that cannot hold a second
       row when the product's can. -->
  .editor-topbar { min-height: 40px; box-sizing: border-box; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => document.body.classList.add("editor-width-auto", "vscode-dark"));
  window.__i18n = { translations: {}, isMac: true, toolbar: { placements: {}, order: [] }, tocAutoHideThreshold: 3, tocVisibility: "hidden", host: { capabilities: ["spellAndGrammar", "imageUpload", "toc", "appPreferences", "agent"], arrangements: ["typographyInGearMenu", "formattingInSecondRow", "fixedToolbarLayout", "barMenusOnClick", "nativeFindBar", "nativeDatePicker", "fixedTocSide", "tocToggleInBar"], shortcuts: [{ keys: "Mod-,", label: "Settings…", section: "Application" }, { keys: "Mod-n", label: "New Note", section: "File" }, { keys: "Mod-o", label: "Open…", section: "File" }, { keys: "Mod-s", label: "Save", section: "File" }, { keys: "Mod-Shift-s", label: "Save a Copy As…", section: "File" }, { keys: "Mod-f", label: "Find…", command: "openFind", section: "Edit" }, { keys: "Mod-Alt-f", label: "Find and Replace…", command: "openFindReplace", section: "Edit" }, { keys: "Mod-g", label: "Find Next", command: "findNext", section: "Edit" }, { keys: "Mod-Shift-g", label: "Find Previous", command: "findPrevious", section: "Edit" }, { keys: "Mod-d", label: "Select Next Occurrence", command: "findSelection", section: "Edit" }, { keys: "Mod-Shift-l", label: "Change All Occurrences", command: "selectAllOccurrences", section: "Edit" }, { keys: "Mod-/", label: "Edit Block as Markdown", command: "editBlockSource", section: "Edit" }, { keys: "Mod-Shift-k", label: "Delete Block", command: "deleteBlock", section: "Edit" }, { keys: "Ctrl-j", label: "Join Lines", command: "joinLines", section: "Edit" }, { keys: "Mod-b", label: "Bold", command: "toggleBold", section: "Format" }, { keys: "Mod-i", label: "Italic", command: "toggleItalic", section: "Format" }, { keys: "Mod-Shift-x", label: "Strikethrough", command: "toggleStrikethrough", section: "Format" }, { keys: "Mod-e", label: "Inline Code", command: "toggleInlineCode", section: "Format" }, { keys: "Mod-Alt-0", label: "Body", command: "setParagraph", section: "Format" }, { keys: "Mod-Alt-1", label: "Heading 1", command: "setHeading1", section: "Format" }, { keys: "Mod-Alt-2", label: "Heading 2", command: "setHeading2", section: "Format" }, { keys: "Mod-Alt-3", label: "Heading 3", command: "setHeading3", section: "Format" }, { keys: "Mod-Alt-4", label: "Heading 4", command: "setHeading4", section: "Format" }, { keys: "Mod-Alt-5", label: "Heading 5", command: "setHeading5", section: "Format" }, { keys: "Mod-Alt-6", label: "Heading 6", command: "setHeading6", section: "Format" }, { keys: "Mod-Shift-8", label: "Bullet List", command: "toggleBulletList", section: "Format" }, { keys: "Mod-Shift-7", label: "Numbered List", command: "toggleOrderedList", section: "Format" }, { keys: "Mod-Shift-9", label: "Task List", command: "toggleTaskList", section: "Format" }, { keys: "Mod-Shift-d", label: "Toggle Task Done", command: "toggleTaskChecked", section: "Format" }, { keys: "Mod-]", label: "Indent", command: "indentBlock", section: "Format" }, { keys: "Mod-[", label: "Outdent", command: "outdentBlock", section: "Format" }, { keys: "Mod-k", label: "Link…", command: "insertLink", section: "Format" }, { keys: "Mod-+", label: "Zoom In", command: "increaseFontSize", section: "View" }, { keys: "Mod--", label: "Zoom Out", command: "decreaseFontSize", section: "View" }, { keys: "Mod-0", label: "Actual Size", command: "resetFontSize", section: "View" }, { keys: "Mod-Alt-[", label: "Fold", command: "fold", section: "View" }, { keys: "Mod-Alt-]", label: "Unfold", command: "unfold", section: "View" }] } };
  // The shell seeds `getState` from the persisted bag in its document-start
  // user script (Bridge.userScript), so the page reads it synchronously before
  // the bundle runs. A harness whose store starts empty cannot see anything
  // that boots FROM that bag, so it is seeded the same way here.
  window.__state = window.__seedState;
  window.__posted = [];
  // The trailing paragraph carries a filler ("really"), which is a style-check
  // hit the page computes for itself. It is here so the suite can ask whether
  // the underlines actually DRAW on this surface, which is the half no check
  // over the Checks menu can answer.
  const CONTENT = "# One\n\nSome text.\n\n## Two\n\ntext\n\n## Three\n\ntext\n\n## Four\n\ntext\n\n## Five\n\ntext\n\nThis is really important.\n";
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        window.postMessage({ type: "init", content: CONTENT, frontmatter: "", syncVersion: 1 }, "*");
      }
    },
    // A real store, not a stub: the formatting dock's expanded flag rides in
    // this bag (webview/components/toolbar/dock.ts), and a setState that
    // forgets would make "it persisted" untestable and always-passing.
    getState: () => window.__state,
    setState: (s) => { window.__state = s; },
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<!-- `toc-right` in the MARKUP, the way the shell serves it
     (`BirtaSchemeHandler.renderPage` writes it on every page): the side is the
     app's rather than the reader's. It cannot move to the DOMContentLoaded line
     above, which is where the other two body classes are set — the bundle is a
     module script, so it runs after parsing and before that event, and the
     sidebar reads this class once as it builds. Set it there and the class is
     on the body while the panel has already docked to the other edge, which is
     a state no build of the product can produce. -->
<body class="toc-right">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
