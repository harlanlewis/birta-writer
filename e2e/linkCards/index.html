<!doctype html>
<!-- e2e harness: link cards (MAR-185) with the master switch ON and the
     link-card default ON. Two lone links (a bare one, a labelled one), a
     provider link that must keep its provider card, a URL mid-prose that must
     never card, and a stubbed host that answers `resolveLinkCard` the way the
     extension does: always, asynchronously, with title and description. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #999999;
    --vscode-editor-font-family: monospace; --vscode-font-family: -apple-system, sans-serif; --vscode-font-size: 13px;
    --vscode-editorWidget-background: #252526; --vscode-editorWidget-border: #454545;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-focusBorder: #007fd4; --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #094771; --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-input-background: #3c3c3c; --vscode-input-foreground: #cccccc;
    --vscode-textLink-foreground: #3794ff; --vscode-panel-border: rgba(128, 128, 128, 0.2);
    --vscode-editor-selectionBackground: #264f78; --vscode-icon-foreground: #cccccc;
    --vscode-toolbar-hoverBackground: #2a2d2e;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); margin: 0; }
  /* Real toolbar height (~40px in VS Code at default font) so the measured
     --editor-topbar-height, and everything laid out from it, matches production. */
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  window.__i18n = {
    translations: {}, isMac: true,
    toolbar: { placements: {}, order: [] },
    network: true, embedsEnabled: true, linkCardsEnabled: true,
    pasteUnfurl: true, pasteUnfurlAutoApply: false,
  };
  window.__posted = [];
  const DOC = [
    "# Alpha",
    "",
    "https://example.com/some/article",
    "",
    "[an article](https://example.org/labelled)",
    "",
    "https://youtu.be/dQw4w9WgXcQ",
    "",
    "read https://example.com/inline today",
    "",
    "Omega",
    "",
  ].join("\n");
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready")
        window.postMessage({ type: "init", content: DOC + "\n", frontmatter: "", syncVersion: 1 }, "*");
      if (msg.type === "resolveEmbedMeta")
        setTimeout(() => window.postMessage(
          { type: "embedMetaResult", id: msg.id, url: msg.url, title: "Stub title" }, "*"), 20);
      // The extension's page fetch, stubbed: title and description for the
      // example.com page, nothing usable for the example.org one.
      if (msg.type === "resolveLinkCard")
        setTimeout(() => window.postMessage({
          type: "linkCardResult", id: msg.id, url: msg.url,
          card: msg.url.includes("example.com")
            ? { title: "An Article <b>Title</b>", description: "What the page says about itself." }
            : null,
        }, "*"), 20);
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
