<!doctype html>
<!-- e2e harness for the shared menu ground. Mirrors the provider template
     (src/MarkdownEditorProvider.ts) with acquireVsCodeApi stubbed.

     The theme block below is DELIBERATELY hostile in two ways that Dark+ is
     hostile in real life, because both are what the unified recipe exists to
     survive:

     1. The four widget grounds are given four DIFFERENT values. Reading them
        per surface is what used to paint the slash menu, the language picker
        and the block menu three colors at once, so the ground checks can only
        mean something if a wrong token would show.
     2. list.activeSelectionBackground is a solid, saturated fill with a light
        knockout, exactly as VS Code Light+ and Dark+ paint it. A focused row
        that keeps the resting ink is legible on a low-alpha wash and unreadable
        here, which is the defect the ink checks pin.

     list.hoverForeground is deliberately ABSENT: most themes leave it unset,
     so the hover ink has to fall back to the menu ink. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #999999;
    /* Four grounds, four values — see the note above. */
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-editorWidget-background: #303031;
    --vscode-editorWidget-border: #454545;
    --vscode-editorSuggestWidget-background: #1a1a2e;
    --vscode-editorSuggestWidget-border: #454545;
    --vscode-editorSuggestWidget-selectedBackground: #7f1d1d;
    --vscode-dropdown-background: #3c3c3c;
    --vscode-dropdown-foreground: #f0f0f0;
    --vscode-widget-border: rgba(128, 128, 128, 0.25);
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-focusBorder: #007fd4;
    --vscode-editor-selectionBackground: #264f78;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-list-activeSelectionBackground: #0060c0;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-button-background: #0e639c;
    --vscode-button-foreground: #ffffff;
    --vscode-textLink-foreground: #3794ff;
    --vscode-editor-font-family: monospace;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  window.__i18n = { translations: {}, isMac: true, toolbar: { placements: {}, order: [] } };
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        window.postMessage({
          type: "init",
          content: "# Title\n\nSome text.\n\n```js\nconst a = 1;\n```\n",
          syncVersion: 1,
        }, "*");
      }
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
