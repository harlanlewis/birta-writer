<!doctype html>
<!-- e2e harness: a wheel over a diagram pane has to scroll the DOCUMENT.

     The pane offers zoom through its overlay buttons and its pan pad, and
     handles no wheel event at all. It used to intercept ctrl+wheel for
     pinch-to-zoom, and the cost of that was not the branch, it was the
     listener: preventDefault needs `{ passive: false }`, and a non-passive
     wheel listener takes every gesture over the element off the compositor and
     onto the main thread whether or not the branch fires. A pane in the middle
     of a document is scrolled past far more often than it is zoomed.

     The fixture's diagram is deliberately wider than its pane, so the pane has
     real scrollable overflow. That is the condition under which a container is
     most likely to claim a gesture, and a fixture whose diagram fits would pass
     this suite without ever posing the question.

     `page.mouse.wheel` rather than a dispatched WheelEvent: a synthetic event
     goes straight to the listener and cannot tell an intercepted gesture from a
     forwarded one. Only the browser's own input pipeline decides who scrolls. -->
