<!doctype html>
<!-- e2e harness page for the frontmatter (metadata) panel. Mirrors the
     provider template (src/MarkdownEditorProvider.ts) with acquireVsCodeApi
     stubbed. The --vscode-* variables below stand in for the set VS Code
     injects natively; add any variable a new check depends on. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #999999;
    --vscode-editorWidget-background: #252526;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-editorWidget-border: #454545;
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-input-placeholderForeground: #888888;
    --vscode-focusBorder: #007fd4;
    --vscode-editor-selectionBackground: #264f78;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-panel-border: rgba(128, 128, 128, 0.2);
    --vscode-errorForeground: #f48771;
    --vscode-symbolIcon-keywordForeground: #c586c0;
    --vscode-textBlockQuote-background: rgba(128, 128, 128, 0.08);
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  /* Give the harness topbar a realistic toolbar height (~48px in VS Code) so
     the empty-state geometry check actually discriminates: a button placed at
     a hardcoded offset would clear a skinny empty div but not the real bar. */
  .editor-topbar { min-height: 48px; }
</style>
<script>
  // birta.frontmatterAddButton ships OFF. The empty-state geometry checks are
  // about where the button lands once opted in, so the harness turns it on;
  // ?addBtn=0 leaves it off to check the shipped default renders no panel.
  const ADD_BTN = new URLSearchParams(location.search).get("addBtn") !== "0";
  window.__i18n = { translations: {}, isMac: true, toolbar: { placements: {}, order: [] }, frontmatterAddButton: ADD_BTN };
  window.__posted = [];
  const CONTENT = "---\ntitle: Content inventory\ntags:\n  - reference\n  - showcase\n---\n\n# Sample\n\ntext\n";
  const FRONTMATTER = "---\ntitle: Content inventory\ntags:\n  - reference\n  - showcase\n---\n";
  // ?empty=1 boots a document with no frontmatter, for the fm-empty checks.
  const EMPTY = new URLSearchParams(location.search).get("empty") === "1";
  // ?toml=1 boots a TOML (+++) block, which routes to the raw editor rather
  // than the table: every table rule is a YAML rule (MAR-363).
  const TOML = new URLSearchParams(location.search).get("toml") === "1";
  const TOML_FRONTMATTER = '+++\ntitle = "Content inventory"\ndraft = false\n+++\n';
  // ?nested=1 boots the nested-value shapes: a sequence of mappings, a
  // sequence of flow mappings, a one-line flow mapping, and a nested mapping.
  // They are here rather than in the default block because the checks above
  // count rows, and because only a real engine lays out the pairs grid.
  const NESTED = new URLSearchParams(location.search).get("nested") === "1";
  const NESTED_FRONTMATTER = [
    "---",
    "title: Content inventory",
    "sources:",
    "  - id: ga4-schema",
    "    resource: https://developers.google.com/analytics/bigquery/export-schema",
    "  - id: finance-handbook",
    "    resource: references/finance.md",
    "usage_window: { from: 2026-06-01T00:00:00Z, to: 2026-06-30T00:00:00Z }",
    "verified:",
    "- { by: human:ahormati, at: 2026-06-25T09:00:00Z }",
    "executor:",
    "  resource: references/skills/run-on-bq.md",
    "  receipt: [job_id, executed_sql, result]",
    "---",
    "",
  ].join("\n");
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        window.postMessage({
          type: "init",
          content: EMPTY ? "# Sample\n\ntext\n" : CONTENT,
          frontmatter: EMPTY ? undefined
            : (TOML ? TOML_FRONTMATTER : (NESTED ? NESTED_FRONTMATTER : FRONTMATTER)),
          syncVersion: 1,
        }, "*");
      }
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
