<!doctype html>
<!-- e2e harness for Focus mode (MAR-72). Mirrors the provider template with
     acquireVsCodeApi stubbed. The content deliberately trips the style check,
     so "proofreading went quiet" is observable as decorations disappearing
     rather than inferred from a config read. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #999999;
    --vscode-editorWidget-background: #252526;
    --vscode-editorWidget-foreground: #cccccc;
    --vscode-editorWidget-border: #454545;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-widget-border: rgba(128, 128, 128, 0.25);
    --vscode-focusBorder: #007fd4;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-editor-font-family: monospace;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  /* min-height, never height: the bundle hides the bar by collapsing the
     topbar, and a fixed height here would hold it open and make every
     "focus hid the toolbar" check pass against a bar still on the page. */
  .editor-topbar { min-height: 40px; box-sizing: border-box; }
</style>
<script>
  window.__i18n = { translations: {}, isMac: true, toolbar: { placements: {}, order: [] } };
  window.__posted = [];
  // Phrases the style check matches, so the document carries visible
  // decorations before focus and must carry none during it.
  const CONTENT = [
    "# Focus sample",
    "",
    "At the end of the day, it is important to note that this leverages a robust",
    "and seamless solution in order to deliver value.",
    "",
    "## Second section",
    "",
    "Basically, the reason why this happened is due to the fact that nobody checked.",
    "",
    "### Third section",
    "",
    "Ordinary prose so the outline has something to list.",
    "",
  ].join("\n");
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        window.postMessage({ type: "init", content: CONTENT, syncVersion: 1 }, "*");
      }
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
