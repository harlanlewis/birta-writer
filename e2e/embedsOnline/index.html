<!doctype html>
<!-- e2e harness: URL embeds with the network master switch ON — the path the
     notesFeatures suite deliberately cannot reach (it pins the OFF case). This
     is where the cards actually render, so it is the only place the click
     behavior and the activate swap can be observed at all.

     The fixture carries ONE bare link per provider in the table
     (webview/utils/embedProviders.ts), plus the two shapes that must NOT card:
     a titled link to the same video, and a bare link to an unknown host. A new
     provider belongs here as a new line — the checks are written per-kind off
     `data-embed-kind`, so they grow with the table instead of pinning a count
     that only ever fit one provider. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #999999;
    --vscode-editor-font-family: monospace; --vscode-font-family: -apple-system, sans-serif; --vscode-font-size: 13px;
    --vscode-editorWidget-background: #252526; --vscode-editorWidget-border: #454545;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-focusBorder: #007fd4; --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #094771; --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-input-background: #3c3c3c; --vscode-input-foreground: #cccccc;
    --vscode-textLink-foreground: #3794ff; --vscode-panel-border: rgba(128, 128, 128, 0.2);
    --vscode-editor-selectionBackground: #264f78; --vscode-icon-foreground: #cccccc;
    --vscode-toolbar-hoverBackground: #2a2d2e;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); margin: 0; }
  /* Real toolbar height (~40px in VS Code at default font) so the measured
     --editor-topbar-height, and everything laid out from it, matches production. */
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  window.__i18n = {
    translations: {}, isMac: true,
    toolbar: { placements: {}, order: [] },
    network: true, embedsEnabled: true,
    pasteUnfurl: true, pasteUnfurlAutoApply: false,
  };
  window.__posted = [];
  const DOC = [
    "# Alpha",
    "",
    "https://youtu.be/dQw4w9WgXcQ",
    "",
    // Valid shape, dead video: the request stub 404s this id's thumbnail, so
    // this card pins the branded-fallback error state (never a blank frame).
    "https://youtu.be/aaaaaaaaaaa",
    "",
    "https://www.loom.com/share/0123456789abcdef0123456789abcdef",
    "",
    "https://www.figma.com/design/BAZsTPbh6W1r66Bdo9xkQp/Design-System",
    "",
    "https://github.com/microsoft/vscode/pull/12345",
    "",
    "https://vimeo.com/1084537",
    "",
    "[a titled link](https://youtu.be/dQw4w9WgXcQ)",
    "",
    "https://www.twitch.tv/videos/1234567890",
    "",
    // MAR-186 P2: the Google sharing-mode split (published → player,
    // ordinary /edit → info card), Drive preview, Miro live-embed, Linear.
    "https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUvWxYz01234/view",
    "",
    "https://docs.google.com/document/d/e/2PACX-1vAbCdEfGhIjKlMnOpQrStUvWxYz0123456789/pub",
    "",
    "https://docs.google.com/presentation/d/e/2PACX-1vAbCdEfGhIjKlMnOpQrStUvWxYz0123456789/pub",
    "",
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vAbCdEfGhIjKlMnOpQrStUvWxYz0123456789/pubhtml",
    "",
    "https://docs.google.com/document/d/1AbCdEfGhIjKlMnOpQrStUvWxYz01234/edit",
    "",
    "https://miro.com/app/board/uXjVO5X2CWo=/",
    "",
    "https://linear.app/birta/issue/MAR-186/embed-provider-roadmap",
    "",
    // MAR-186 P3: the code playgrounds.
    "https://codepen.io/birta/pen/AbCdEf",
    "",
    "https://codesandbox.io/s/new-react-sandbox-abc123",
    "",
    "https://stackblitz.com/edit/vitejs-vite-abc123",
    "",
  ].join("\n");
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready")
        window.postMessage({ type: "init", content: DOC + "\n", frontmatter: "", syncVersion: 1 }, "*");
      // The extension's oEmbed resolver, stubbed: always replies (the real
      // handler's contract), async like the real round trip. checks.mjs
      // asserts both the requests (window.__posted) and the caption render.
      if (msg.type === "resolveEmbedMeta")
        setTimeout(() => window.postMessage(
          { type: "embedMetaResult", id: msg.id, url: msg.url, title: "Stub title" }, "*"), 20);
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
