<!doctype html>
<!-- e2e harness page for MDX documents. Mirrors the provider template
     (src/MarkdownEditorProvider.ts) with acquireVsCodeApi stubbed, and takes
     the document AND its wire format from window.__mdxInit, which checks.mjs
     injects before any script runs. The format matters here more than
     anywhere else: it is what sends the entry down format/loader.ts's lazy
     import, so a page that forgot it would silently test the markdown
     pipeline against an .mdx file and pass. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none';
           style-src 'self' 'unsafe-inline';
           script-src 'nonce-mdxharness' 'self';
           img-src 'self' data:;
           font-src 'self' data:;">
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #999999;
    --vscode-editorWidget-background: #252526;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-editorWidget-border: #454545;
    --vscode-widget-border: rgba(128, 128, 128, 0.25);
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-focusBorder: #007fd4;
    --vscode-editor-selectionBackground: #264f78;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-list-activeSelectionBackground: #094771;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-textLink-foreground: #3794ff;
    --vscode-textCodeBlock-background: #2a2a2a;
    --vscode-textPreformat-foreground: #ce9178;
    --vscode-errorForeground: #f48771;
    --vscode-editor-font-family: monospace;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script nonce="mdxharness">
  window.__i18n = { translations: {}, isMac: true, toolbar: { placements: {}, order: [] } };
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready") {
        const init = window.__mdxInit || { content: "# Sample\n\ntext\n" };
        window.postMessage({
          type: "init",
          content: init.content,
          format: init.format,
          lineMap: [],
          syncVersion: 0,
        }, "*");
      }
    },
    getState: () => undefined,
    setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" nonce="mdxharness" src="dist/webview.js"></script>
