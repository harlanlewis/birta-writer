<!doctype html>
<!-- e2e harness: the ```svg fence (MAR-402). The fence is the one construct
     whose SOURCE is the picture, so what is under test is the sanitizer and the
     shared pane, not an engine. jsdom cannot stand in: no layout for the pane,
     no real parse of the injected markup, and no resource timeline to prove
     nothing was fetched.

     This page carries NO Content-Security-Policy, which is deliberate and is
     what makes the checks here mean something: inside the extension the CSP
     already makes a <script> and an onload= inert, so an in-editor check of
     either passes with the sanitizer removed. Here they get their chance. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #999999;
    --vscode-editor-font-family: monospace; --vscode-font-family: -apple-system, sans-serif; --vscode-font-size: 13px;
    --vscode-editorHoverWidget-background: #252526; --vscode-editorHoverWidget-foreground: #cccccc;
    --vscode-editorHoverWidget-border: #454545; --vscode-focusBorder: #007fd4;
    --vscode-toolbar-hoverBackground: rgba(90,93,94,0.31); --vscode-list-hoverBackground: #2a2d2e;
    --vscode-button-background: #0e639c; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #1177bb;
    --vscode-button-secondaryBackground: #3a3d41;
    --vscode-inputOption-activeBackground: rgba(14,99,156,0.4); --vscode-inputOption-activeBorder: #007fd4;
    --vscode-editor-hoverHighlightBackground: rgba(90,93,94,0.25);
    --vscode-editor-selectionBackground: #264f78;
    --vscode-editorWidget-background: #252526; --vscode-editorWidget-border: #454545;
    --vscode-textCodeBlock-background: #2a2a2a;
    --vscode-editorLineNumber-foreground: #858585;
    --vscode-errorForeground: #f48771;
    --vscode-panel-border: #444444;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  window.__i18n = {
    translations: {}, isMac: true,
    mermaidTheme: "auto",
    toolbar: { placements: {}, order: [] },
  };
  window.__posted = [];
  // Anything the injected markup manages to run sets one of these. Both stay
  // null when the sanitizer is doing its job, and BOTH fire without it.
  window.__pwn = null;
  const DOC = [
    "# SVG render",
    "",
    // 1. The ordinary case: a fence sized by its own width/height attributes.
    "```svg",
    '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">',
    '  <title>plain</title>',
    '  <rect width="240" height="120" fill="#4a90d9"/>',
    '  <circle cx="60" cy="60" r="30" fill="#ffffff"/>',
    '  <text x="110" y="66" fill="#ffffff">hello</text>',
    "</svg>",
    "```",
    "",
    // 2. Sized by viewBox alone: no width/height on the root, which is what an
    //    LLM most often emits and what the 300x150 replaced-element default
    //    would otherwise mis-measure.
    "```svg",
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">',
    '  <rect width="400" height="200" fill="#7ac943"/>',
    "</svg>",
    "```",
    "",
    // 3. The hostile fence. Every construct the policy exists for, at once:
    //    an event handler on the root, a script, a document-wide <style>, a
    //    remote <image>, a remote reference through a presentation attribute,
    //    and a remote font. The <script> tag is split so it does not close
    //    this page's own.
    "```svg",
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" onload="window.__pwn = 1">',
    "  <" + "script>window.__pwn = 2;</" + "script>",
    "  <style>.ProseMirror { display: none }</style>",
    '  <image href="https://tracker.example/pixel.png" width="1" height="1"/>',
    '  <rect width="200" height="100" fill="url(https://tracker.example/paint.png)"/>',
    '  <rect id="kept" x="10" y="10" width="60" height="30" fill="#d94a4a"/>',
    "</svg>",
    "```",
    "",
    // 4. A local reference stays: a gradient through url(#id) is the shape the
    //    remote strip must NOT catch, and is the control for check 3.
    "```svg",
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50">',
    '  <defs><linearGradient id="g"><stop offset="0" stop-color="#111111"/><stop offset="1" stop-color="#eeeeee"/></linearGradient></defs>',
    '  <rect width="100" height="50" fill="url(#g)"/>',
    "</svg>",
    "```",
    "",
    // 5. Source with no <svg> in it at all. Deliberately last so the
    //    first-match selectors in checks.mjs keep addressing the valid fences.
    //    DOMPurify does not throw on this; it hands prose back as prose, so a
    //    pane that took the sanitizer's word for it would paint a blank.
    "```svg",
    "not markup, just a sentence someone typed",
    "```",
    "",
  ].join("\n");

  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready")
        window.postMessage({ type: "init", content: DOC + "\n", syncVersion: 1 }, "*");
    },
    getState: () => undefined, setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
