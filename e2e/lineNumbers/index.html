<!doctype html>
<!-- e2e harness: the source line-number gutter with birta.lineNumbers ON.
     The fixture is a zoo of the constructs whose RENDER HEIGHT diverges from
     their source-line count — that divergence is the whole problem the gutter
     solves, and it is only observable with a real layout engine. Mirrors the
     provider template with acquireVsCodeApi stubbed. -->
<meta charset="utf-8">
<style>
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #999999;
    --vscode-editorLineNumber-foreground: #858585;
    --vscode-editor-font-family: monospace; --vscode-font-family: -apple-system, sans-serif; --vscode-font-size: 13px;
    --vscode-editorHoverWidget-background: #252526; --vscode-editorHoverWidget-foreground: #cccccc;
    --vscode-editorHoverWidget-border: #454545; --vscode-focusBorder: #007fd4;
    --vscode-toolbar-hoverBackground: rgba(90,93,94,0.31); --vscode-list-hoverBackground: #2a2d2e;
    --vscode-editor-selectionBackground: #264f78; --vscode-textCodeBlock-background: #262626;
    --vscode-button-background: #0e639c; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #1177bb;
    --vscode-button-secondaryBackground: #3a3d41; --vscode-panel-border: #454545;
  }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  .editor-topbar { height: 40px; box-sizing: border-box; }
</style>
<script>
  // Decoration must settle in AFTER first paint, never on the mount path
  // (AGENTS.md → Launch performance; DESIGN_PRINCIPLES → "Analysis never blocks
  // interactivity"). Wrapping performance.mark rather than observing it makes
  // the reading synchronous with the mark, so the check cannot drift by a task.
  (() => {
    const origMark = performance.mark.bind(performance);
    performance.mark = (name, ...rest) => {
      if (name === "mdw:editor-painted" && window.__atPaint === undefined) {
        window.__atPaint = {
          numbers: document.querySelectorAll(".line-number").length,
          layers: document.querySelectorAll(".line-number-layer").length,
        };
      }
      return origMark(name, ...rest);
    };
  })();
  // tocAutoHideThreshold high so the ToC never auto-docks over the start edge —
  // the drawer's interaction with the gutter has its own rule and is not what
  // this suite measures.
  window.__i18n = {
    translations: {}, isMac: true, toolbar: { placements: {}, order: [] },
    tocAutoHideThreshold: 999, lineNumbers: true,
  };
  window.__posted = [];

  // The fixture, built line by line so the source line numbers are known
  // exactly. `L` is 1-indexed, matching what the gutter paints.
  const LINES = [];
  const at = {};                               // name → source line number
  const push = (name, ...lines) => { if (name) { at[name] = LINES.length + 1; } LINES.push(...lines); };

  push("title", "# Line number zoo", "");
  push("intro", "An opening paragraph on a single source line.", "");
  // One source line that soft-wraps to many visual rows: ONE number, then a
  // deliberately large gap. The classic case an evenly-spaced ladder gets wrong.
  push("longPara", ("A very long paragraph on one single source line that the renderer must wrap across many visual rows. ").repeat(12).trim(), "");
  push("tightHead", "## Tight list", "");
  push("tight", "- alpha", "- beta", "- gamma", "");
  push("looseHead", "## Loose list", "");
  push("loose", "- first item", "", "- second item", "", "- third item", "");
  push("codeHead", "## Code", "");
  // Interior lines belong to the code block's OWN gutter, so the document
  // gutter numbers the fences and nothing between them.
  push("codeOpen", "```js", "const alpha = 1;", "const beta = 2;", "const gamma = 3;", "```", "");
  push("tableHead", "## Table", "");
  push("table", "| a | b |", "| --- | --- |", "| c | d |", "| e | f |", "");
  push("calloutHead", "## Callout", "");
  push("callout", "> [!note]", "> Callout body text.", "");
  push("foldHead", "## Foldable section", "");
  push("foldBody", "Body of the foldable section.", "", "Second paragraph of the foldable section.", "");
  // Tail content, so the foldable section above has something to collapse INTO
  // and the document is tall enough to scroll.
  for (let i = 1; i <= 40; i++) {
    push(i === 1 ? "tailStart" : null, `### Tail ${i}`, "", `Tail paragraph ${i}.`, "");
  }
  push("last", "Final paragraph.", "");

  window.__at = at;
  window.__lines = LINES;
  window.__sourceLines = LINES.length;
  const DOC = LINES.join("\n");
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => {
      window.__posted.push(msg);
      if (msg.type === "ready")
        window.postMessage({ type: "init", content: DOC, syncVersion: 1 }, "*");
    },
    getState: () => undefined, setState: () => {},
  });
</script>
<link rel="stylesheet" href="dist/webview.css">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
