<!doctype html>
<!-- The Mac app's page. A template: the shell fills {{CSP}}, {{ROOT_STYLE}}, {{THEME_STYLE}} and {{THEME_CLASS}} at
     serve time (mac/Sources/BirtaWriter/WebHost.swift, BirtaSchemeHandler). It
     mirrors src/webviewHtml.ts in shape and e2e/perf/index.html in spirit: the
     same dist/webview.js the extension ships, the host palette in place of the
     workbench's, and the config blob + acquireVsCodeApi shim injected as a
     document-start user script rather than inline. The bundle must be served
     at a URL ending in dist/webview.js: webview/utils/katexLoader.ts finds its
     sibling stylesheet by that selector. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birta Writer</title>
<link rel="stylesheet" href="dist/hostPalette.css">
<link rel="stylesheet" href="dist/webview.css">
<!-- The VS Code colour theme in force, if one is: the palette's variables
     redeclared by a stylesheet placed after the palette's link, so its
     declarations win on order (mac/Sources/BirtaWriterCore/VSCodeTheme.swift).
     Empty under the macOS appearance. Kept as an element with an id so a
     theme picked while the page is up replaces the text rather than the page
     (WebHost.setTheme). -->
<style id="host-theme">{{THEME_STYLE}}</style>
<style>
  /* Filled at serve time, with what the outline panel remembers about its own
     width. Here rather than in the boot script because the page reads it while
     it mounts; `BootConfig.tocRootStyle` has the whole reason. Empty until the
     panel's edge has been dragged. */
  {{ROOT_STYLE}}

  html, body { margin: 0; height: 100%; background: var(--vscode-editor-background); }

  /* No elastic overscroll. The toolbar is `position: fixed`, and WebKit
     rubber-bands fixed elements with the page when a scroll runs past either
     end, so the bar visibly slides away from the top edge and springs back.
     A document inside an application window has nothing above or below it to
     reveal, which is what the bounce is for elsewhere. */
  html, body { overscroll-behavior: none; }

  /* The panel's window chrome, which only this host has. The bundle is the
     extension's and knows nothing about a titlebar, traffic lights or a
     pointer that has left the window, so the rules that follow are the host
     page's, exactly as the palette above it is. */

  .editor-topbar {
    /* No hairline under it: the toolbar is the top of the page, not a bar
       stuck above it. */
    border-bottom: none;
  }

  /* Where the window's own furniture ends, and so the leading floor for
     anything the PAGE draws in that band. Named once because it has two
     claimants, the toolbar's first row and a fullscreen surface's title, and a
     second copy of the number is a second thing to get wrong. The reasoning
     for the number itself is on the toolbar rule below. */
  :root {
    --mac-titlebar-leading: 78px;
  }

  /* The inset belongs to the FIRST row, not to the bar. That row sits under a
     transparent full-height titlebar, and that band is the WINDOW'S: the
     traffic lights and, after them, the native title accessory naming the file
     (mac/Sources/BirtaWriter/TitleBar.swift). Under `formattingInSecondRow` the
     page puts nothing in the leading half at all, so this is a floor rather
     than a fit. The native title beside them needs no such number: AppKit
     places a leading titlebar accessory clear of the buttons itself, and
     `mac/scripts/measure.sh` checks the live frame rather than trusting either
     of us to have got it right.

     On the bar it would indent every row, and the second row is below the band
     with nothing to clear: its controls would start three quarters of an inch
     in, lined up against nothing, with the window's own left edge empty. */
  .editor-topbar .toolbar {
    padding-left: var(--mac-titlebar-leading);
    /* The first row IS the titlebar band, so it takes the band's height and
       centres its controls in it (`.toolbar` is already `align-items:
       center`), instead of padding its own way to a height of its own.

       That is what puts these buttons on the same axis as the native ones
       beside the title, and the axis is not negotiable: macOS centres a window
       title on the close button, and the native accessory is given the whole
       band and centres on it. A row padded to any other height centres its
       glyphs somewhere else, and the two halves of what reads as one strip of
       buttons are then drawn on two lines. `mac/scripts/measure.sh` compares
       the two out of the live window, which is the only place the pair can be
       asked about at all.

       The height rides the served page (`BirtaSchemeHandler.titlebarBandHeight`
       fills it in beside {{ROOT_STYLE}} above), because it is the system's
       number rather than ours: it is not the same under every macOS titlebar
       style, so a literal here would be right until it was not, with nothing
       on this side able to tell. The fallback stands only for a page served
       before the window has been laid out, and is the band this window's own
       toolbar style gives today: close enough that the first frame does not
       visibly resettle, and wrong in a way nothing here could notice, which
       is why it is a fallback and not the number. */
    min-height: var(--mac-titlebar-height, 40px);
    padding-top: 0;
    padding-bottom: 0;
  }

  /* The tab bar's row, when the window has tabs. macOS draws it as a row of
     the titlebar band over the page, directly under the title row, so the
     page leaves that row clear: a gap under the FIRST row, sized by the
     window (`BirtaSchemeHandler.tabBarHeight`, pushed on change). Under the
     first row and not the whole bar, because the formatting row is the top of
     the content area rather than of the window: it sits below the tabs, level
     with a docked side panel, and a bar that padded under both rows would put
     the tabs under the editing controls instead of over them. Everything that
     measures the bar (content padding, the find bar, the drawer panels
     through `getContentAreaTop`) follows, because a flex item's margin counts
     in the bar's height.

     And the bundle is told the same strip under its own name, so the chrome
     that hangs off a control in the first row (a tooltip, a dropdown, the
     sidebar flyout) opens under the tabs rather than into them
     (`hostStripUnderTopbar`, webview/utils/headingUtils.ts). */
  .editor-topbar.editor-topbar--stacked .toolbar {
    margin-bottom: var(--mac-tabbar-height, 0px);
    /* The gap is a margin, and the stacked bar's ground is its rows' rather
       than its own (dock.css), so nothing would paint it: the tab bar macOS
       draws there is a capsule with the page showing round it, and the text
       would scroll past behind the tabs. The row's shadow, offset by the
       gap's own height and with no blur, is the row's ground drawn once more
       directly under it. It covers the gap while the gap is no taller than
       the row, which holds because a tab bar is shorter than a titlebar. */
    box-shadow: 0 var(--mac-tabbar-height, 0px) 0 var(--vscode-editor-background);
  }

  /* No hairline under the formatting row either, for the reason the bar has
     none (above). */
  .editor-topbar.editor-topbar--stacked .tb-dock:not([hidden]) {
    box-shadow: none;
  }

  :root {
    --host-strip-under-topbar: var(--mac-tabbar-height, 0px);
  }

  /* A fullscreen surface covers the whole window, the titlebar band included,
     and the window draws its buttons OVER the page rather than beside it. The
     bundle puts that surface's name in the top-left corner, which is the one
     corner this host does not have, so on this host alone the name is drawn
     under the traffic lights.

     Moved clear rather than moved down. Past the buttons it keeps the axis the
     band lines everything else up on, and it stays a corner label; pushed below
     the band it would be a label floating in the picture, which is what the
     corner placement exists to avoid. The trailing cluster needs nothing: the
     window's furniture is all at the leading edge. */
  .fs-title {
    left: var(--mac-titlebar-leading);
  }

  /* At rest the panel is a page and a cursor.

     At rest means the window has neither the pointer nor the keyboard;
     `Coordinator.applyChromeVisibility` sets `mac-resting` from both, and one
     alone is the wrong rule. A window you are typing in, with the pointer
     parked elsewhere on the screen, is not resting, and taking its controls
     away mid-sentence is how a good idea gets switched off.

     Everything the window draws over the document goes at once: the top row's
     utility block (checks, find, settings, the outline's toggle), the
     formatting row under it, and the floating palette over a selection. The
     native half of the band follows the same rule in Swift
     (`TitleBarView.syncHoverChrome`), and IN LOCKSTEP is most of the point. A
     titlebar that empties from one end reads as a rendering fault rather than
     as a window at rest, and so does a bar that has gone while the row under
     it is still fading. That is why the duration here is
     `TitlebarActionsView.chromeFadeSeconds` rather than a number chosen for
     this file; `macRestingChrome.test.ts` holds the two spellings together.

     They cost NOTHING to fade, which is the constraint the whole treatment
     runs under. `opacity` and `visibility` both leave the box where it is, so
     every zone keeps its width, the bar keeps its height, and nothing under
     any of them moves. The width in particular is load-bearing off the page:
     the shell measures the trailing block and the title's ceiling is computed
     against it (`TitlebarBand`), so a fade that collapsed it would pull the
     file's name wider every time you looked away. The formatting row is the
     same argument one axis over: it is a row of the bar, so removing it would
     reflow the document every time attention left the window, which is the
     thing opacity was chosen to avoid. What is left at rest is a taller quiet
     band, which is a band with nothing in it rather than a hole in the page.

     `visibility` rides along with the opacity so a faded control is not a
     click target sitting invisibly over the band, and the transition is on
     opacity alone with visibility stepped at the end, or a control would
     vanish before the fade it is meant to be doing.

     The window's own title stays: it is native chrome, and macOS does not fade
     a title when you look away from it.

     The formatting row's own quiet-at-rest look (dock.css) is a different
     thing and is exempted for more contrast and for forced colours, which this
     rule deliberately overrides: that one draws the row back WHILE you are
     working, and somebody who asked for more contrast has said no to it. This
     one is about a window nobody is looking at, where the answer is the same
     for everybody and is the same as the trailing zone's beside it. */
  body.mac-resting .editor-topbar .tb-zone--right,
  body.mac-resting .editor-topbar .tb-dock,
  body.mac-resting .sel-toolbar {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.12s ease, visibility 0s linear 0.12s;
  }

  .editor-topbar .tb-zone--right,
  .editor-topbar .tb-dock,
  .sel-toolbar {
    transition: opacity 0.12s ease, visibility 0s;
  }

  /* Somebody who asked the system for less movement still gets the resting
     state; what goes is the fade to it.

     Restated here rather than inherited. The formatting row carries its own
     reduced-motion rule (dock.css), and the selector above is more specific
     than it, so without this the rule that file wrote would be overridden by
     this file and the row would go on fading for a reader who asked it not
     to. The two zones beside it never had one, and want the same answer. */
  @media (prefers-reduced-motion: reduce) {
    .editor-topbar .tb-zone--right,
    .editor-topbar .tb-dock,
    .sel-toolbar,
    body.mac-resting .editor-topbar .tb-zone--right,
    body.mac-resting .editor-topbar .tb-dock,
    body.mac-resting .sel-toolbar {
      transition: none;
    }
  }

  /* The bound file is gone: the band keeps the gear and nothing else.

     `Coordinator.showMissingFileScreen` sets the class, and the state it names
     is the one where there is no document. Find has nothing to search, the
     checks nothing to flag, the outline no headings and the typography
     controls no text to set; every one of them is a control that answers with
     nothing, in the one state where the window is already saying something has
     gone wrong. The gear is the exception because its job is not about the
     document at all: on a panel launched with no Dock icon and no menu bar in
     front of it, that button is the way to preferences, and where the notes
     are kept is exactly what somebody looks for when one has disappeared.

     The formatting row goes too, and it is the one thing here that reflows the
     page. That is the cost the resting treatment above refuses to pay and this
     one is right to: resting happens whenever attention leaves the window, and
     this happens once, on a state change the reader has already been told
     about by a card in the middle of the window. */
  body.mac-note-missing .editor-topbar .tb-zone > *:not([data-item-id="settings"]),
  body.mac-note-missing .tb-dock {
    display: none;
  }

  /* ...and the gear does not fade with the rest at rest.

     A control somebody has to know to hover for is not a route to preferences,
     and the window this state is most likely to be seen on is a summoned panel
     that has just lost the pointer. It overrides the resting rule above rather
     than being excluded from it, so nothing about the ordinary case moves. */
  body.mac-note-missing.mac-resting .editor-topbar .tb-zone--right {
    opacity: 1;
    visibility: visible;
  }
</style>
</head>
<body class="{{THEME_CLASS}}">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
</body>
</html>
