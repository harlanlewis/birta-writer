<!doctype html>
<!-- The Jot page. A template: the shell fills {{CSP}} and {{THEME_CLASS}} at
     serve time (jot/Sources/BirtaJot/WebHost.swift, BirtaSchemeHandler). It
     mirrors src/webviewHtml.ts in shape and e2e/perf/index.html in spirit: the
     same dist/webview.js the extension ships, the host palette in place of the
     workbench's, and the config blob + acquireVsCodeApi shim injected as a
     document-start user script rather than inline. The bundle must be served
     at a URL ending in dist/webview.js: webview/utils/katexLoader.ts finds its
     sibling stylesheet by that selector. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birta Jot</title>
<link rel="stylesheet" href="dist/hostPalette.css">
<link rel="stylesheet" href="dist/webview.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--vscode-editor-background); }

  /* No elastic overscroll. The toolbar is `position: fixed`, and WebKit
     rubber-bands fixed elements with the page when a scroll runs past either
     end, so the bar visibly slides away from the top edge and springs back.
     A document inside an application window has nothing above or below it to
     reveal, which is what the bounce is for elsewhere. */
  html, body { overscroll-behavior: none; }

  /* The panel's window chrome, which only this host has. The bundle is the
     extension's and knows nothing about a titlebar, traffic lights or a
     pointer that has left the window, so the rules that follow are the host
     page's, exactly as the palette above it is. */

  .editor-topbar {
    /* The toolbar sits under a transparent full-height titlebar, and that band
       is the WINDOW'S: the traffic lights and, after them, the native title
       accessory naming the file (jot/Sources/BirtaJot/TitleBar.swift). Under
       `formattingInBottomDock` the page puts nothing in the leading half at
       all, so this is a floor rather than a fit. `JotPanel.trafficLightInset`
       is the same number in Swift; neither can import the other. */
    padding-left: 78px;
    /* No hairline under it: the toolbar is the top of the page, not a bar
       stuck above it. */
    border-bottom: none;
  }

  /* At rest (the pointer is off the window, `jot-resting` set by the shell)
     the panel is a page and a cursor. The editing controls are in the dock at
     the bottom leading corner, so the dock is what settles down, kept WHOLE
     rather than reduced to its toggle: it is one thing to the eye, and
     dissolving part of it reads as chrome breaking up rather than as chrome
     settling down. Opacity rather than display, so nothing reflows.

     The top bar's utility block stays, because it is the only route to search
     and settings and a window with no way in is not a quieter window. The
     window's own title stays too: it is native chrome, and macOS does not fade
     a title when you look away from it. */
  .tb-dock { transition: opacity 0.15s ease; }

  body.jot-resting .tb-dock {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body class="{{THEME_CLASS}}">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
</body>
</html>
