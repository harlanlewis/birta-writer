<!doctype html>
<!-- The Jot page. A template: the shell fills {{CSP}} and {{THEME_CLASS}} at
     serve time (jot/Sources/BirtaJot/WebHost.swift, BirtaSchemeHandler). It
     mirrors src/webviewHtml.ts in shape and e2e/perf/index.html in spirit: the
     same dist/webview.js the extension ships, the host palette in place of the
     workbench's, and the config blob + acquireVsCodeApi shim injected as a
     document-start user script rather than inline. The bundle must be served
     at a URL ending in dist/webview.js: webview/utils/katexLoader.ts finds its
     sibling stylesheet by that selector. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birta Jot</title>
<link rel="stylesheet" href="dist/hostPalette.css">
<link rel="stylesheet" href="dist/webview.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--vscode-editor-background); }

  /* No elastic overscroll. The toolbar is `position: fixed`, and WebKit
     rubber-bands fixed elements with the page when a scroll runs past either
     end, so the bar visibly slides away from the top edge and springs back.
     A document inside an application window has nothing above or below it to
     reveal, which is what the bounce is for elsewhere. */
  html, body { overscroll-behavior: none; }

  /* The panel's window chrome, which only this host has. The bundle is the
     extension's and knows nothing about a titlebar, traffic lights or a
     pointer that has left the window, so the three rules that follow are the
     host page's, exactly as the palette above it is. */

  .editor-topbar {
    /* The toolbar sits under a transparent full-height titlebar, so the first
       button would land on the traffic lights. Carve their corner out. */
    padding-left: 78px;
    /* No hairline under it: the toolbar is the top of the page, not a bar
       stuck above it. */
    border-bottom: none;
  }

  /* At rest (the pointer is not over the window, jot-resting is set by the
     shell) the panel is a page and a cursor: traffic lights in one corner, the
     settings gear in the other, and nothing else. Opacity rather than display,
     so nothing reflows and the gear never moves. */
  .editor-topbar .tb-zone,
  .editor-topbar .tb-item { transition: opacity 0.15s ease; }

  /* A choice the window's owner makes, set by the shell as a class for the
     same reason jot-resting is one. Hiding the editing cluster leaves the
     window buttons and the utility block, which is the panel for someone who
     formats with Markdown syntax and shortcuts.

     `margin-left: auto` is what keeps that block where it was. The left zone
     carries `flex: 1` and is what pushes the right one to the trailing edge,
     so removing it from the layout collapses the whole cluster leftwards into
     the space it vacated. */
  body.jot-no-format-toolbar .editor-topbar .tb-zone--left { display: none; }
  body.jot-no-format-toolbar .editor-topbar .tb-zone--right { margin-left: auto; }

  /* At rest the panel is a page and a cursor: the window buttons in one
     corner, the utility block in the other, and the editing cluster gone.
     The block is kept WHOLE rather than reduced to the gear, because it is one
     thing to the eye and dissolving all but one item of it reads as chrome
     breaking up rather than as chrome settling down. */
  body.jot-resting .editor-topbar .tb-zone--left {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body class="{{THEME_CLASS}}">
<div class="editor-topbar"></div>
<div id="editor"></div>
<script type="module" src="dist/webview.js"></script>
</body>
</html>
