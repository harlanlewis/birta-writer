name: Release

# Cuts a Birta Writer release: infers end-user highlights from the changelog,
# packages the VSIX, tags the commit, and publishes a GitHub Release.
#
# Runs nightly and no-ops when nothing new has landed since the last tag.
#
# It publishes to two registries, in two independent jobs: the VS Code
# Marketplace, and Open VSX for the forks that cannot reach it. Each stays
# dormant until its own secret exists (AZURE_CLIENT_ID, OVSX_PAT), so a repo with
# neither still builds the downloadable VSIX + notes — the "build, don't publish
# yet" phase — and adding one does not wait on the other.
#
# Publishing authenticates with Microsoft Entra ID workload identity federation
# (OIDC), not a stored token. Azure DevOps is retiring the "all accessible
# organizations" PAT that vsce's documented flow depends on, on 2026-12-01, and
# whether an org-scoped PAT can replace it is still an open question upstream
# (microsoft/vscode#322741) — so there is no long-lived credential here to expire
# or rotate. See docs/RELEASING.md for the one-time identity setup.
#
# The Azure indirection is meant to be temporary: `vsce publish --oidc` exchanges
# the GitHub OIDC token at the Marketplace directly, with no Azure resource in the
# picture. It is `next`-channel only and its Marketplace-side policy is unconfirmed
# as of 2026-08-04. When both land, drop the azure/login step below, swap
# --azure-credential for --oidc, and the subscription can be deleted.
#
# Versions are CalVer, derived from the release date (America/Los_Angeles):
#   YYYY . (month*100 + day) . (releases already cut that day)
#   e.g. the 2026-07-14 nightly -> 2026.714.0, a manual re-cut -> 2026.714.1
# Every field is a plain integer, so the result is valid semver (VS Code requires
# major.minor.patch and forbids leading zeros) and increases monotonically across
# same-day, day, month, and year boundaries — which the Marketplace/update ordering
# depends on. This is the single source of truth: the same string tags the commit,
# names the release, and stamps the VSIX. package.json is not a release authority;
# it is overwritten at build time and not committed back.
#
# The patch field was a time-of-day stamp (hour*10000 + min*100 + sec) until
# 2026-07-31. It bought sub-day uniqueness that the release cadence never needed
# — the nightly cron runs once and `concurrency: release` serializes it against a
# manual dispatch — at the cost of a version nobody could read: 2026.730.54523 is
# a build id, not a version. The counter below gives the same guarantee.

on:
  schedule:
    # 11:00 UTC = 04:00 America/Los_Angeles during PDT (03:00 during PST).
    # GitHub cron is UTC-only with no DST; adjust to '0 12 * * *' if you'd rather
    # anchor 04:00 to PST (standard time) instead.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if no new commits since the last tag'
        type: boolean
        default: false

# Prevent overlapping nightly + manual runs from double-tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bounds, not budgets. Each is set far above what its job needs, because a
  # release that is merely slow must finish: this job tags, publishes and
  # attaches, and killing it partway leaves a release half-cut. What it stops is
  # a wedged step holding the runner and the `release` concurrency group for
  # GitHub's default of six hours, which would also block the next nightly.
  # Recovery from a timeout is the documented one for any failed job here, in
  # docs/RELEASING.md: re-run the failed job alone, since `--skip-duplicate`
  # makes both publishes idempotent.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      # Both are for the build-provenance attestation below. id-token here is
      # unrelated to the publish job's Entra login — it signs against Sigstore,
      # and needs no environment, so it does not re-couple this job to one.
      id-token: write
      attestations: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    env:
      # Dormant until the secret exists, exactly like the publish job's
      # HAS_AZURE. Without it the release still stamps the packaged CHANGELOG
      # and writes correct notes; only the commit back to main is skipped.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the notes range
          # The stamp commit at the end of this job pushes to main, which
          # requires a PR from anyone but an admin. GITHUB_TOKEN is not one, so
          # the push needs an admin-owned token; branch protection has
          # enforce_admins off, so no bypass rule is involved. Falls back to the
          # job token — which cannot push — when the secret is unset.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Determine version and whether to release
        id: plan
        run: |
          # checkout@v4 does not reliably bring tags (fetch-tags + fetch-depth:0
          # interact badly), and the guard below is meaningless without them —
          # fetch explicitly.
          git fetch --tags --force origin

          PREV=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"          # commits since the last release
          else
            PREV="(none)"                  # first-ever release: all history is new
            RANGE="HEAD"
          fi
          # Exclude this job's own stamp commits (MAR-282). The last step
          # commits the rolled CHANGELOG back to main, so a plain count would
          # see that commit the next night, cut a release of nothing, stamp
          # another heading, and repeat forever. Excluding them by subject
          # keeps the guard honest without making it depend on where the tag
          # sits, so the tag can still be created last (see below).
          COUNT=$(git rev-list --count --invert-grep --grep='^release: stamp' "$RANGE")
          echo "prev=$PREV"   >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          # CalVer from the release date (see the header comment). Fields are
          # zero-padded by date(1), so 10# forces base-10 arithmetic — otherwise
          # bash reads "08"/"09" as invalid octal and the August/September builds
          # would crash.
          read -r Y MO DA < <(TZ='America/Los_Angeles' date +'%Y %m %d')
          MMDD=$((10#$MO * 100 + 10#$DA))

          # The patch field counts releases already cut today, so it may only
          # reset to 0 when the day — and therefore the minor field — changes;
          # semver compares minor before patch, so a reset can never order a new
          # release below an old one. When the newest tag is from today, resume
          # from its patch rather than starting at 0: that covers a same-day
          # re-cut AND the one-way migration off the old time-stamped patch
          # (2026.730.54523 -> 2026.730.54524 today, then 2026.731.0 tomorrow).
          N=0
          case "${PREV#v}" in
            "$Y.$MMDD."*) N=$(( ${PREV##*.} + 1 )) ;;
          esac
          # Belt and braces: a tag the case above didn't predict (a hand-cut one,
          # or a `sort -V` ordering surprise) still can't collide.
          while git rev-parse -q --verify "refs/tags/v$Y.$MMDD.$N" >/dev/null; do
            N=$((N + 1))
          done
          VERSION="$Y.$MMDD.$N"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No commits since $PREV — skipping release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION ($COUNT commit(s) since $PREV)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.release == 'true'

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.release == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.plan.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # The nightly used to package whatever was at HEAD without checking that
      # anything about it was green: `pnpm run package` runs vscode:prepublish
      # (an esbuild build) and nothing else, and the release cron fires on its
      # own schedule regardless of whether CI for the newest commit had finished
      # — or finished green (MAR-265). Verifying here rather than querying the
      # commit's check-runs makes the artifact self-justifying, and costs a few
      # minutes on an unattended job nobody is waiting for.
      - name: Verify the commit being released
        if: steps.plan.outputs.release == 'true'
        run: pnpm typecheck && pnpm test

      # The only place the engines floor is ever LAUNCHED. The suite opens a
      # real-shaped document (invalid mermaid included) in the real custom
      # editor and fails if the webview stops answering — a freeze class no
      # unit test or delta gate can see. xvfb: Electron needs a display.
      - name: Open the corpus in the engines floor and in stable
        if: steps.plan.outputs.release == 'true'
        run: |
          FLOOR=$(node -p "require('./package.json').engines.vscode.replace(/^\D+/, '')")
          BIRTA_ITEST_VSCODE="$FLOOR" xvfb-run -a pnpm test:integration
          BIRTA_ITEST_VSCODE=stable xvfb-run -a pnpm test:integration

      - name: Stamp package.json to the release version
        if: steps.plan.outputs.release == 'true'
        run: pnpm version "${{ steps.plan.outputs.version }}" --no-git-tag-version --allow-same-version

      # Roll [Unreleased] into this version's heading BEFORE the notes are
      # generated and before the VSIX is packaged, so the shipped changelog —
      # which is what the Marketplace renders on its Changelog tab — leads with
      # the version the user just installed, and the notes describe only this
      # release (MAR-282).
      - name: Stamp CHANGELOG.md to the release version
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/stamp-changelog.mjs

      # Jot's changelog is stamped with the SAME version, so the two files never
      # disagree about what a release contained. It is a separate file because
      # the two products have separate readers: this one is not in the VSIX
      # (`.vscodeignore` excludes `jot/**`), so the Marketplace Changelog tab
      # carries only what a Marketplace reader can act on.
      - name: Stamp jot/CHANGELOG.md to the release version
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/stamp-changelog.mjs jot/CHANGELOG.md

      - name: Generate release notes
        if: steps.plan.outputs.release == 'true'
        env:
          RANGE: ${{ steps.plan.outputs.range }}
          VERSION: ${{ steps.plan.outputs.version }}
          OUT: RELEASE_NOTES.md
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cheapest tier; kick up to claude-sonnet-5 or claude-opus-4-8 here if
          # the highlights aren't good enough. Without the key the script
          # re-sections the stamped CHANGELOG itself, and only drops to a plain
          # commit list when there is no changelog section to read.
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: node scripts/gen-release-notes.mjs

      # The stamp above leaves an EMPTY `## [Unreleased]` behind, because the
      # repository needs that heading and the next stamp looks for it by name.
      # A reader of the Marketplace Changelog tab does not: it put an empty
      # "Unreleased" above the version they installed. So the VSIX is built from
      # a copy without it, and the repository copy is restored immediately, well
      # before the commit-back step at the end of this job.
      - name: Package extension
        if: steps.plan.outputs.release == 'true'
        run: |
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.repo.md"
          node scripts/strip-empty-unreleased.mjs
          mkdir -p releases && pnpm run package
          cp "$RUNNER_TEMP/CHANGELOG.repo.md" CHANGELOG.md

      # Supply chain (MAR-130). A source audit can only tell you what the source
      # does; it cannot tell you the published binary was built from it. This
      # signs a Sigstore-backed provenance statement binding the VSIX's digest to
      # this repository, commit, and workflow run, so anyone can check the artifact
      # without trusting — or rebuilding — this pipeline.
      #
      # The same file is what the publish job uploads to the Marketplace, so the
      # attestation covers both distribution channels rather than just this one.
      - name: Attest build provenance
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: releases/*.vsix

      # A plain checksum for anyone who just wants to compare two files without
      # installing tooling. NOTE: the VSIX is not yet byte-reproducible — vsce
      # stamps each zip entry with the wall clock, so two builds of an identical
      # tree differ in the archive even though their *contents* are identical.
      # So this hash identifies THIS artifact; it is not something a third party
      # can independently reproduce. See docs/RELEASING.md → Verifying a release.
      - name: Record the VSIX checksum
        if: steps.plan.outputs.release == 'true'
        run: |
          cd releases
          sha256sum *.vsix | tee SHA256SUMS.txt
          vsix=$(echo *.vsix)
          {
            printf '\n---\n\n### Verifying this release\n\n'
            printf 'This release carries a signed build-provenance attestation. To confirm the `.vsix` was built by this repository from this commit:\n\n'
            printf '```\ngh attestation verify %s --repo %s\n```\n\n' "$vsix" "$GITHUB_REPOSITORY"
            printf 'SHA-256:\n\n```\n%s\n```\n' "$(cat SHA256SUMS.txt)"
          } >> ../RELEASE_NOTES.md

      # The release action creates the tag itself (at this run's commit) in the
      # same step that publishes the release. Tagging separately, earlier, would
      # risk an orphan tag if a later step failed — and that tag would then make
      # the next run's "anything new since the last tag?" guard skip this content.
      #
      # This survives the CHANGELOG stamp commit below because the guard filters
      # stamp commits out by subject rather than relying on the tag sitting at
      # or after them. The tag therefore points at the pre-stamp commit, so the
      # tagged tree's CHANGELOG.md is one heading behind the shipped one — the
      # same relationship package.json has always had, being stamped at build
      # time and never committed back.
      - name: Tag and create GitHub Release
        if: steps.plan.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Just the tag. The repo name is redundant on the repo's own releases
          # page, and it pushed the only distinguishing part — the version — past
          # the sidebar's truncation, so every entry in the list read "Birta
          # Writer v2026.7…". The date is redundant too: with CalVer the version
          # IS the date, and GitHub shows the exact timestamp beside it anyway.
          name: v${{ steps.plan.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            releases/*.vsix
            releases/SHA256SUMS.txt

      - name: Hand the VSIX to the publish job
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: releases/*.vsix
          retention-days: 7

      # Give the repo the same heading the artifact just shipped with, so
      # [Unreleased] holds only what has NOT been released yet.
      #
      # Deliberately the last step, and continue-on-error: the release is
      # already tagged, published, and on the Marketplace by now, so nothing
      # here may fail it. A skipped push is self-correcting — the next night's
      # heading simply spans two days' entries.
      - name: Commit the stamped changelog to main
        if: steps.plan.outputs.release == 'true' && env.HAS_RELEASE_TOKEN == 'true'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # package.json is stamped for the build and is NOT a release
          # authority; it stays 0.0.0 in the repo. Restoring it also leaves the
          # tree clean enough for the rebase below.
          git checkout -- package.json

          git add CHANGELOG.md jot/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelogs unchanged — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The subject is what the release guard greps for; changing it here
          # without changing the guard reintroduces the perpetual empty release.
          git commit -m "release: stamp CHANGELOG for v${{ steps.plan.outputs.version }}"

          # main requires linear history, so rebase rather than merge if a PR
          # landed while this job was running.
          git pull --rebase origin main
          git push origin HEAD:main

  # Publishing is a SEPARATE job on purpose. It is the only part that needs the
  # `marketplace-publish` environment, and an environment is a policy surface —
  # if one ever gains a required reviewer or a deployment branch rule, it stalls
  # every job that declares it. Keeping it off the release job means tagging, the
  # GitHub Release, and the downloadable VSIX can never be held up by a policy
  # that only publishing cares about. The blast radius of a broken credential is
  # likewise one skipped job, not a failed release.
  publish:
    name: Publish to VS Code Marketplace
    needs: release
    timeout-minutes: 15
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The federated credential's subject is repo:<owner>/<repo>:environment:<name>,
    # and GitHub only mints that claim for a job declaring the environment — so
    # this line is what makes the OIDC login match.
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write # request the OIDC token azure/login exchanges for Entra creds
    env:
      # Dormant until the secret exists — see docs/RELEASING.md for the one-time
      # managed-identity setup. Until then this job runs and skips, exactly as the
      # publish step did while VSCE_PAT was unset.
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4
        if: env.HAS_AZURE == 'true'

      - uses: pnpm/action-setup@v4
        if: env.HAS_AZURE == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_AZURE == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.HAS_AZURE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the VSIX
        if: env.HAS_AZURE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: releases

      # allow-no-subscriptions is required: the identity is federated purely to
      # authenticate against the Marketplace and holds no role on any Azure
      # subscription, so a normal `az login` would fail for want of one.
      - name: Authenticate to Microsoft Entra ID
        if: env.HAS_AZURE == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # --skip-duplicate makes this job idempotent: re-running it after the
      # Marketplace already accepted the version is a no-op instead of a hard
      # failure. Note it is NOT a general retry path for a failed publish — the
      # release job derives its version from the clock, so re-running the whole
      # workflow cuts a NEW version rather than retrying this one. Re-run this
      # job alone.
      #
      # A pre-release channel, if ever wanted, is a flag not a version: append
      # `--pre-release` here for those builds; the CalVer scheme is unchanged.
      - name: Publish
        if: env.HAS_AZURE == 'true'
        run: pnpm vsce publish --no-dependencies --packagePath releases/*.vsix --azure-credential --skip-duplicate

  # The second registry. Open VSX is what the VS Code forks read: VSCodium,
  # Cursor, Windsurf, Gitpod and Eclipse Theia cannot reach the Microsoft
  # Marketplace at all, because its terms restrict it to Microsoft's own
  # products. Publishing here is the only way Birta Writer is installable in
  # any of them.
  #
  # A SIBLING of `publish`, not a step inside it. The two registries share
  # nothing but the VSIX, and their credentials fail independently: an Entra
  # login that stops working must not hold Open VSX back, and a revoked Open
  # VSX token must not hold the Marketplace back. Run in parallel, fail apart.
  #
  # It downloads the release job's artifact rather than packaging its own, so
  # all three destinations — Marketplace, Open VSX, and the GitHub Release —
  # carry the same bytes, and the one build-provenance attestation covers every
  # channel. Packaging here would produce a different archive (vsce stamps zip
  # entries with the wall clock) that no attestation describes.
  #
  # No environment and no OIDC. The Marketplace job declares an environment
  # because the federated credential's subject names one; Open VSX authenticates
  # with a plain token, so there is nothing for an environment to match, and an
  # environment is a policy surface worth adding only when something needs it.
  publish-openvsx:
    name: Publish to Open VSX
    timeout-minutes: 15
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Dormant until the secret exists, exactly like HAS_AZURE above. The
      # namespace must also be created once by hand before the first publish
      # can land; see docs/RELEASING.md.
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}

    steps:
      - uses: actions/checkout@v4
        if: env.HAS_OVSX == 'true'

      - uses: pnpm/action-setup@v4
        if: env.HAS_OVSX == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_OVSX == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.HAS_OVSX == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the VSIX
        if: env.HAS_OVSX == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: releases

      # --packagePath on a path ending in .vsix publishes that file as-is; ovsx
      # only invokes vsce to package when handed a directory. --skip-duplicate
      # makes a re-run idempotent, with the same caveat as the Marketplace job:
      # it is not a retry path for the whole workflow, which would derive a new
      # version from the clock. Re-run this job alone.
      #
      # The token goes through the environment, which ovsx reads natively, so it
      # never appears in an argument list.
      - name: Publish
        if: env.HAS_OVSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm ovsx publish --packagePath releases/*.vsix --skip-duplicate

  # The Birta Writer app, attached to the same GitHub Release as the VSIX.
  #
  # A separate job for the same reason publishing is: it needs a macOS runner
  # (Swift, codesign) and it must not be able to hold up the tag, the release
  # or the extension. A failure here costs the app download for one release.
  #
  # The app is AD-HOC SIGNED, not Developer ID signed and not notarized, so
  # Gatekeeper will refuse it on a machine that did not build it until the
  # download quarantine is cleared. jot/scripts/update-jot.sh does that
  # deliberately and says so; a stranger should not run either. This is the
  # personal-machines rung of the ladder, and the honest name for it is "not
  # distributed to other people yet".
  jot-app:
    name: Attach Birta Writer to the release
    needs: release
    timeout-minutes: 20
    if: needs.release.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write # attach an asset to the release this workflow just cut
    steps:
      # The tag, not the branch: the release job pushes a CHANGELOG stamp
      # commit to main afterwards, so main and the tagged tree differ.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm jot:build

      # The version the release is stamped with, so a downloaded copy can say
      # what it is. package.json stays 0.0.0 in the tree for the same reason it
      # does for the extension: the release job is the only version authority.
      - name: Stamp the bundle version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          PLIST="jot/build/Birta Writer.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST"
          # Editing the plist invalidates the signature the build applied.
          codesign --force --deep --sign - "jot/build/Birta Writer.app"

      # ditto, not zip: it preserves the bundle's symlinks and extended
      # attributes, and a zip(1) archive of an .app can arrive unopenable.
      - name: Zip
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd jot/build
          ditto -c -k --keepParent "Birta Writer.app" "BirtaJot-$VERSION.zip"
          shasum -a 256 "BirtaJot-$VERSION.zip" > "BirtaJot-$VERSION.zip.sha256"

      # `gh release upload` rather than the action the release job uses: this
      # job ATTACHES to a release that already exists and already carries its
      # notes, and upload is the operation that can only add assets. The action
      # takes the whole release as its subject, so what it does to a name and a
      # body it was not given is a behaviour to look up rather than a guarantee,
      # and the notes are not worth risking to save a line.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v$VERSION" \
            "jot/build/BirtaJot-$VERSION.zip" \
