name: Jot

# Builds the Birta Writer shell (jot/, SwiftPM) and runs its Swift tests on
# a macOS runner: the core target's, and the app target's, which build real
# AppKit windows headlessly. A separate workflow with a paths filter for the
# same reason as typing-perf: macOS minutes are the expensive ones, and most
# PRs cannot touch the shell. Advisory, not required: a required check a paths
# filter skips leaves a PR waiting forever.
#
# The webview bundle the app embeds is covered by ci.yml; this job builds the
# assets only to prove build-app.sh assembles a bundle from them.
#
# It also runs the e2e suites that speak for the panel, in WebKit. That is
# a carve-out from ci.yml's "e2e is a local pre-push gate" policy, and it earns
# one on the policy's own terms: those suites assert which block holds which
# text, never layout geometry or an absolute time, and each guards its own
# reach so a keystroke race reports as the probe missing rather than as the
# editor failing. This job is advisory, so a flake costs a re-read and not a
# blocked PR. It exists because a WebKit-only editing defect shipped with every
# other check green (Return left the caret in the previous block):
# nothing in CI ran the engine Jot renders in.
#
# The paths filter covers what can BREAK the panel, which is more than jot/:
# the app embeds dist/webview.js, so a webview/ or shared/ change reaches it
# without touching a Swift file.
on:
  pull_request:
    branches: [main]
    paths:
      - 'jot/**'
      - 'webview/**'
      - 'shared/**'
      - 'packages/**'
      - 'e2e/enterCaret/**'
      - 'e2e/jotHost/**'
      - 'e2e/pasteIntoEmpty/**'
      - 'e2e/taskToggle/**'
      - '.github/workflows/jot.yml'

concurrency:
  group: jot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jot-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: swift --version
      - name: swift test (BirtaJotCore and the app)
        run: swift test --package-path jot
      - name: build the webview bundle and assemble the app
        run: |
          node esbuild.mjs --production
          bash jot/scripts/build-app.sh
          test -x "jot/build/Birta Writer.app/Contents/MacOS/BirtaJot"
          test -f "jot/build/Birta Writer.app/Contents/Resources/web/dist/webview.js"
          test -f "jot/build/Birta Writer.app/Contents/Resources/web/dist/hostPalette.css"
          # The icons are committed, not generated here, so what this proves is
          # that build-app.sh still copies them in: an app with no AppIcon.icns
          # gets the blank document icon, and one with no MenuBarTemplate.pdf
          # falls back to a stock symbol, both silently.
          test -f "jot/build/Birta Writer.app/Contents/Resources/AppIcon.icns"
          test -f "jot/build/Birta Writer.app/Contents/Resources/MenuBarTemplate.pdf"

      - name: install the WebKit browser
        run: npx playwright install webkit

      # The engine the panel renders in. Each suite mounts the real production
      # bundle: enterCaret drives the keyboard, jotHost drives the capability
      # gating, pasteIntoEmpty drives an image paste into an empty document,
      # which is Jot's opening gesture, and taskToggle edits the document from
      # a command Jot reaches by a keystroke on its Edit menu. Run separately
      # because e2e/run.mjs takes one suite name.
      - name: e2e in WebKit
        run: |
          BIRTA_E2E_BROWSER=webkit node e2e/run.mjs enterCaret
          BIRTA_E2E_BROWSER=webkit node e2e/run.mjs jotHost
          BIRTA_E2E_BROWSER=webkit node e2e/run.mjs pasteIntoEmpty
          BIRTA_E2E_BROWSER=webkit node e2e/run.mjs taskToggle
