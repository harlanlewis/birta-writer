name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede a PR's own earlier run when it is pushed again. Without this every
# push left its predecessor running to completion — observed on PR #130 with
# three runs live at once, one of them for a commit that no longer existed
# after an amend. Concurrent runs also make each other's timings unreadable,
# which matters when `launch-perf` IS a timing measurement.
#
# Only PRs cancel. A push to `main` is the record that main is green, so those
# runs always finish even if another lands behind them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries a `timeout-minutes`, and each is set well above what that
# job needs so it never trims a slow but healthy run. Without one, GitHub's
# default lets a wedged step hold a REQUIRED check open for hours, which is
# indistinguishable from a queue and cannot be waited out. A step that stalls
# should fail fast enough to be re-run, and the browser download below is the
# one most exposed: it reaches a third-party CDN and an apt mirror, neither of
# which this repository controls.
jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # esbuild STRIPS types without checking them, so neither the build job
      # nor the perf jobs can catch a type error — before this step, one could
      # merge to main and surface only at runtime. Runs before the tests so a
      # type error fails fast.
      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Packaging is the only thing that reaches scripts/check-vsix.mjs, and
      # until this step nothing in CI ran it. Two pull requests could each be
      # green, each sit within the guard's limits alone, and leave the default
      # branch unpackageable once both had landed, with the nightly Release job
      # as the first detector (MAR-383).
      #
      # It runs on every pull request rather than behind a `paths` filter,
      # because the archive is built from a deny-list and the mistake this
      # catches is a top-level directory that did not exist before. No filter
      # can name that path in advance, which is exactly how Jot's source tree
      # shipped. The cost is a zip and an `unzip -l` on a build this job was
      # already doing: `vsce package` runs `vscode:prepublish` itself, so this
      # REPLACES the explicit build step rather than adding a second build.
      - name: Package (production build, then the packaging guard)
        run: pnpm run package

      - name: Verify output files
        run: |
          test -f dist/extension.js || (echo "dist/extension.js missing" && exit 1)
          test -f dist/webview.js   || (echo "dist/webview.js missing" && exit 1)

  # Deliberate exception to the "e2e/perf is local-only" rule below: the
  # eager-bytes gate involves no browser and no timing — it walks the esbuild
  # metafile, which is deterministic for a given lockfile (two clean production
  # builds are byte-identical), so it can never be flaky in CI. It is a cheap
  # BACKSTOP to the launch A/B: it fails only when eager bytes exceed the BUDGET
  # ceiling in e2e/perf/bundle-baseline.json (an accidental heavy static import),
  # not on normal feature growth. The failure message says how to raise the
  # ceiling deliberately.
  perf-bundle:
    name: Eager-Bytes Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (production, with metafile)
        run: node esbuild.mjs --production --metafile

      - name: Check eager bytes against the committed baseline
        run: pnpm perf:bundle --check

      # Rides along in this job because it needs the same input the eager-bytes
      # gate just built: the production metafiles. `licenses/THIRD_PARTY_LICENSES.md`
      # is generated from what esbuild actually inlines, so the only place that
      # can tell whether it is current is a job that has a fresh production
      # build — and a second job would pay another install + build for it.
      #
      # Same determinism argument as above: the metafile is a pure function of
      # the lockfile, so this can never be flaky.
      # The script is invoked directly rather than via `pnpm notices:check`,
      # which would build a SECOND time — the step above already produced the
      # production metafiles this reads. (Locally, prefer `pnpm notices:check`;
      # it builds them for you.)
      - name: Check the third-party attribution appendix is current
        run: node scripts/generate-third-party-notices.mjs --check

  # Same-session launch A/B: builds the PR's merge-base and its head, measures
  # both back-to-back in headless Chromium, and gates on the LAUNCH-TIME delta.
  # This is the deliberate, safe way to run a browser-timing check in CI (the
  # "e2e is local-only" note below is about ABSOLUTE-timing assertions, which are
  # machine-dependent): comparing two builds on the SAME runner cancels the
  # machine-load noise, so only the delta — the thing we actually trust — gates.
  # It also gates only the strong-signal fixtures and double-confirms a
  # regression across two passes before failing. Boot time is a first-class
  # metric (AGENTS.md 'Launch performance'), so this is a required, blocking check.
  launch-perf:
    name: Launch Perf (A/B)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # to upsert the result comment

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the merge-base commit + its tree

      # checkout@v4 + fetch-depth:0 can leave tags in a bad state (same caveat
      # handled in release.yml).
      - run: git fetch --tags --force origin

      # This job is REQUIRED, so it can't use a workflow-level `paths` filter:
      # a required check that never runs leaves the PR waiting on a status that
      # will never arrive. Instead the job always runs and always reports — it
      # just skips the expensive two-build measurement when the PR cannot have
      # moved launch time at all (docs, extension-side src/, CI config). That
      # turns ~2m4s into ~20s on those PRs while keeping the check satisfied.
      #
      # The list is deliberately wider than "files that provably affect boot":
      # narrowing a gate to specific modules is how it silently stops covering
      # what it was built for.
      - name: Does this PR touch anything that can move launch time?
        id: relevant
        run: |
          # Three-dot: compare against the MERGE BASE, so unrelated commits that
          # landed on main after this branch forked don't count as changes here.
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '^(webview/|packages/|shared/|esbuild\.mjs|pnpm-lock\.yaml|e2e/perf)'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "→ launch-relevant; running the full A/B"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "→ nothing launch-relevant changed; skipping the measurement"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.relevant.outputs.value == 'true'

      - uses: actions/setup-node@v4
        if: steps.relevant.outputs.value == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.relevant.outputs.value == 'true'
        run: pnpm install --frozen-lockfile

      # Key the cache on the Playwright version itself rather than on the
      # lockfile. The lockfile is what PINS that version, but it also moves for
      # every unrelated dependency, and each of those would otherwise throw away
      # a browser that never changed. Fails loudly rather than emitting an empty
      # key, which would quietly collapse every version onto one cache entry.
      - name: Resolve the Playwright version
        if: steps.relevant.outputs.value == 'true'
        id: playwright
        run: |
          VERSION=$(node -p "require('playwright/package.json').version")
          test -n "$VERSION" || { echo "could not resolve the Playwright version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright $VERSION"

      # The browser binary is the slow, third-party half of the step below, and
      # the half that can stall: `install --with-deps` fetches Chromium from
      # Playwright's CDN and then installs system packages through apt. Caching
      # the download removes the CDN from the common path; the apt half still
      # runs every time, so nothing changes about which system packages are
      # present. No restore-keys: a miss here means a browser build this cache
      # has never held, so an approximate hit would restore a stale browser the
      # install below downloads past anyway, and then keep it forever.
      - name: Cache the Playwright browser
        if: steps.relevant.outputs.value == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.relevant.outputs.value == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Escape hatch for an intentional, justified launch cost: a `perf-accept`
      # PR label or a `Perf-Regression-Accepted: <reason>` trailer on any PR
      # commit makes the gate report the regression but not block.
      - name: Resolve perf-accept
        if: steps.relevant.outputs.value == 'true'
        id: accept
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          ACCEPT=""
          if echo "$LABELS" | grep -q '"perf-accept"'; then ACCEPT="label:perf-accept"; fi
          # Use the PR's base SHA, not origin/<branch> — actions/checkout does not
          # reliably create the remote-tracking ref, but the base SHA is a parent
          # of the checked-out merge commit and always present.
          # Read the raw body, NOT `%(trailers:...)`. Git's trailer parser
          # rejects a whole block when >25% of its lines are not `key: value`,
          # and this repo's mandated `Closes MAR-NN` line (no colon) trips that
          # heuristic — so on any commit that also closes an issue, which is
          # most of them, the trailer hatch silently resolved to empty.
          TRAILER=$(git log "${{ github.event.pull_request.base.sha }}..HEAD" --format='%B' \
            | sed -n 's/^[[:space:]]*Perf-Regression-Accepted:[[:space:]]*//p' | grep -v '^$' | head -1 || true)
          if [ -n "$TRAILER" ]; then ACCEPT="trailer:$TRAILER"; fi
          echo "value=$ACCEPT" >> "$GITHUB_OUTPUT"

      - name: Launch A/B vs merge-base
        if: steps.relevant.outputs.value == 'true'
        env:
          PERF_ACCEPT: ${{ steps.accept.outputs.value }}
        run: node e2e/perf-ab.mjs --base "${{ github.event.pull_request.base.sha }}" --runs 9 --json ab.json

      - name: Comment launch A/B result
        if: always() && steps.relevant.outputs.value == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let r;
            try { r = JSON.parse(fs.readFileSync('ab.json', 'utf8')); }
            catch { return; } // build/abort failed before JSON was written — the job status carries it
            const round = (x) => (x == null ? '–' : Math.round(x * 10) / 10);
            const line = (name, p) => {
              const b = p[name]?.base?.median?.launch, a = p[name]?.head?.median?.launch;
              if (b == null || a == null) return `| ${name} | – | – | – |`;
              const d = a - b, pct = (d / b) * 100, s = d >= 0 ? '+' : '';
              const gated = r.gated.includes(name);
              return `| ${gated ? '**' + name + '**' : name} | ${round(b)} | ${round(a)} | ${s}${round(d)} ms (${s}${round(pct)}%) |`;
            };
            const rows = Object.keys(r.pass1).map((n) => line(n, r.pass1)).join('\n');
            const confirmed = r.confirmedRegressions ?? [];
            const status = confirmed.length === 0
              ? '✅ **NEUTRAL** — no confirmed launch regression'
              : (r.accepted
                  ? `🟡 **REGRESSED but ACCEPTED** (${confirmed.join(', ')})`
                  : `❌ **LAUNCH REGRESSED** (${confirmed.join(', ')}) — confirmed across two passes`);
            // Per-span breakdown for the gated fixtures — a neutral total can hide
            // a heavier `create` masked by a lighter `eager`, so show where time went.
            const SUB = ['eager', 'roundtrip', 'create', 'toc', 'toolbar'];
            const spanRows = (name) => {
              const g = r.pass1[name]; if (!g) return '';
              const cells = SUB.map((s) => {
                const b = g.base?.median?.[s], a = g.head?.median?.[s];
                if (b == null && a == null) return `| ${s} | – | – | – |`;
                const d = (a ?? 0) - (b ?? 0), sign = d >= 0 ? '+' : '';
                return `| ${s} | ${round(b)} | ${round(a)} | ${sign}${round(d)} ms |`;
              }).join('\n');
              return `\n**${name}**\n\n| span | base ms | head ms | Δ |\n| --- | --- | --- | --- |\n${cells}\n`;
            };
            const breakdown = r.gated.map(spanRows).join('\n');
            const body = [
              '<!-- launch-perf-ab -->',
              '### Launch A/B — merge-base vs head',
              '',
              status,
              '',
              `Median launch over ${r.runsPerFixture} interleaved pairs/fixture (**bold** = gated; ≥3% AND ≥10 ms counts as a real move).`,
              '',
              '| fixture | base ms | head ms | Δ |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              '<details><summary>Per-span breakdown (gated fixtures)</summary>',
              breakdown,
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.find((c) => c.body?.includes('<!-- launch-perf-ab -->'));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

# The e2e suite (real bundle in headless Chromium) is a LOCAL pre-push gate,
# run with `pnpm test:e2e`, not a CI job. Two suites are the exception, and
# they run in .github/workflows/jot.yml under WebKit rather than here: see that
# file's header for why those two qualify and this policy still holds. Its layout-geometry and input-timing
# assertions are calibrated to a real desktop browser and are flaky in GitHub's
# headless Chromium (sub-pixel font metrics, keystroke/selection races) — they
# pass locally on the same commit. A perpetually-red, non-blocking CI check is
# worse than none: it trains the one maintainer to ignore e2e, which is exactly
# where a real webview regression would hide. Run it locally before pushing
# webview changes (the /verify skill drives it); re-add a CI job only once the
# suite is stabilized against a pinned-font headless environment.
#
# The `launch-perf` job above is the exception that proves this rule (as is
# `typing-perf`, in .github/workflows/typing-perf.yml): they are safe to block
# on precisely because they never assert an absolute time — each compares two
# builds measured back-to-back on one runner and gates on their delta.
