packages:
    - "packages/*"

# pnpm reads its settings here, never from a `pnpm` field in package.json.
#
# An override outlives its reason silently, so each one names the dependent
# that forces it and what retires it. One whose dependents all ask for a range
# that already excludes the bad versions is dead weight: delete it.
overrides:
    # One KaTeX in the tree, which katexSingleVersion.test.ts requires since
    # 0.18 prefixed its CSS classes. micromark-extension-math still asks for
    # ^0.16. Retires when it asks for ^0.18.
    katex: ^0.18.11
    # GHSA-g3hv-75wg-m249 (below 11.0.1, no fixed 10.x). mocha 12 and vsce ask
    # for ^10. Scoped to 10.x on purpose: 9.x has no fixed release, and glob 10
    # matches nothing under minimatch 11. Retires when both ask for ^11.
    "minimatch@>=10 <11.0.1": ^11.0.1

patchedDependencies:
    "@milkdown/transformer@7.22.1": patches/@milkdown__transformer@7.22.1.patch

# Every dependency that ships an install script is named, because an
# undeclared one fails the install. All three are denied, which is how every
# install and release has run: esbuild resolves its platform binary as an
# optional dependency, and keytar and vsce-sign arrive with vsce. Allowing one
# is a change to what an install executes, so it gets its own reason here.
allowBuilds:
    "@vscode/vsce-sign": false
    esbuild: false
    keytar: false
